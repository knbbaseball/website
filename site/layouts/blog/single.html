{{ define "main" }}

<section class="page-hero page-hero--page">
  <div class="page-hero__body">
    <p class="page-hero__title">{{.Title}}</p>
    <p class="page-hero__subtitle">
      <time datetime="{{ . }}">{{ dateFormat "2006.1.2" .Date }}</time>
      {{ if .Params.Tags }}
        <span class="page-hero__tags">{{- partial "page-tags.html" . -}}</span>
      {{ end }}
    </p>
  </div>
</section>
<main class="site-container site-container--page">
  {{ if .Params.image }}
    <div class="page-media">
      {{ partial "progressive-image.html" (dict "context" . "src" .Params.image "alt" .Title) }}
    </div>
  {{ end }}
  <div class="prose">{{ .Content }}</div>
</main>

{{ end }}
