{{ define "main" }}

{{/*
  Example URL: /tags/
*/}}

<section class="page-hero page-hero--page">
  <div class="page-hero__body">
    <p class="page-hero__title">{{.Title}}</p>
  </div>
</section>
<main class="site-container site-container--page">
  <div class="prose">{{ .Content }}</div>
  {{ range $key, $value := .Data.Terms }}
    <a href="{{ "/" | relLangURL }}{{ $.Data.Plural | urlize }}/{{ $key | urlize }}">
      <h2 class="taxonomy-group__title">{{ $.Data.Singular | humanize }}: {{ $key }}</h2>
    </a>
    <ul class="taxonomy-group__list">
      {{ range $value.Pages }}
        <li class="article-card article-card--list">
          <div class="article-card__body">
            <a href="{{ .Permalink }}" class="article-card__title article-card__title--small">{{ .Title }}</a>
          </div>
        </li>
      {{ end }}
    </ul>
  {{ end }}
</main>

{{ end }}
