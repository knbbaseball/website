<nav class="site-nav" role="navigation" aria-label="メインナビゲーション">
  <div class="site-nav__brand">
    <a class="site-nav__home" href="{{ .Site.BaseURL }}">
      <img class="site-nav__logo" src="{{ relURL "img/logo.svg" }}" alt="">
      <span class="site-nav__name">上郷ノーティボーイズ</span>
    </a>
    <button type="button" class="site-nav__toggle" aria-label="メニューを開く" aria-controls="site-nav-menu" aria-expanded="false">
      <span class="site-nav__toggle-line" aria-hidden="true"></span>
      <span class="site-nav__toggle-line" aria-hidden="true"></span>
      <span class="site-nav__toggle-line" aria-hidden="true"></span>
    </button>
  </div>
  <div id="site-nav-menu" class="site-nav__menu">
    {{ if .Site.Menus.main }}
      <div class="site-nav__links">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="site-nav__link{{ if eq $.RelPermalink .URL }} site-nav__link--current{{ end }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>
            {{ .Name }}
          </a>
        {{ end }}
      </div>
    {{ end }}
  </div>
</nav>
