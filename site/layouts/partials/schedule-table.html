{{/*
  Scope: schedule data for a given team
  */}}

<div class="table-scroll">
  <table class="data-table data-table--full">
    <thead>
      <tr>
        <th class="data-table__cell--xs">チーム</th>
        <th class="data-table__cell--xs">日　付</th>
        <th class="data-table__cell--medium">時　間</th>
        <th class="data-table__cell--extra-wide">内　容</th>
        <th class="data-table__cell--extra-wide">場　所</th>
      </tr>
    </thead>
    <tbody>
      {{ range . }}
      <tr>
        <td>{{ .team }}</td>
        <td>{{ partial "date_no_year" .date }}</td>
        <td>{{ .time }}</td>
        <td>{{ .description }}</td>
        <td>
          {{ if .location_url }}
            <a href=" {{ .location_url }}"> {{ .location_text }}</a>
          {{ else }}
            {{ .location_text }}
          {{ end }}
        </td>
      </tr>
      {{ end }}
    </tbody>
  </table>
</div>
