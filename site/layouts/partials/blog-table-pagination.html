<div class="table-scroll">
  <table class="data-table data-table--full">
    <tbody>
      {{ range .Paginator.Pages.ByPublishDate.Reverse }}
        <tr>
          <th class="data-table__date"><time datetime="{{ . }}">{{ dateFormat "2006/01/02" .Date }}</time></th>
          <td>
            <a href="{{ .RelPermalink }}"><strong class="data-table__post-title">{{ .Title }}</strong></a>
            {{ if ne .Params.tags nil }}
              <span class="tag-list tag-list--inline">
                {{ range .Params.tags }}<span class="tag-list__tag">{{ . }}</span>{{ end }}
              </span>
            {{ end }}
          </td>
        </tr>
      {{ end }}
    </tbody>
  </table>
</div>
{{ partial "pager.html" . }}
