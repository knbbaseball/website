<ul class="feature-grid feature-grid--columns">
  {{ range . }}
    <li class="feature-grid__item">
      {{ if .actionUrl }}<a class="feature-grid__link" href="{{ .actionUrl }}">{{ end }}
      <div class="feature-card">
        <figure class="feature-card__media"><img src="{{ relURL .image }}" alt="{{ .name }}"></figure>
        <div class="feature-card__body">
          <h4 class="feature-card__title">{{ .name }}</h4>
          <div class="prose">{{ .description | markdownify }}</div>
        </div>
      </div>
      {{ if .actionUrl }}</a>{{ end }}
    </li>
  {{ end }}
</ul>
