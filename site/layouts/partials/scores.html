{{/*
  Scope: scores
  */}}

<div class="table-scroll">
  <table class="data-table data-table--full">
    <thead>
      <tr>
        <th></th>
        <th class="data-table__cell--extra-wide">試合</th>
        <th class="data-table__cell--wide">対戦相手</th>
        <th class="data-table__cell--sm">スコア</th>
        <th class="data-table__cell--xs">勝敗</th>
        <th class="data-table__cell--extra-wide">備考</th>
      </tr>
    </thead>
    <tbody>
      {{ range . }}
        <tr>
          <td>{{ dateFormat "2006/01/02" .date }}</td>
          <td>{{ .name }}</td>
          <td>{{ .opponent }}</td>
          <td>{{ .score }}</td>
          <td>{{ .win }}</td>
          <td>{{ .memo }}</td>
        </tr>
      {{ end }}
    </tbody>
  </table>
</div>
