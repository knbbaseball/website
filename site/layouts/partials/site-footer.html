<footer class="site-footer">
  <div class="site-footer__brand">
    <a href="#"><img class="site-footer__logo" src="{{ relURL .Site.Params.LogoImage }}" alt="上郷ノーティボーイズ"></a>
  </div>
  <div class="site-footer__copyright">
    &copy; {{ with .Site.Copyright | default .Site.Title }}{{ . | safeHTML }} {{ now.Format "2006"}}{{ end }}
  </div>
  {{ with .Site.Params.sourceCodeUrl }}
    <div class="site-footer__source">
      <a class="site-footer__source-link" href="{{ . }}" target="_blank" rel="noopener noreferrer">
        {{ default "Source code" $.Site.Params.sourceCodeLabel }}
      </a>
    </div>
  {{ end }}
</footer>
