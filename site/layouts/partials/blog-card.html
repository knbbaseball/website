<a class="article-card article-card--spaced article-card--clickable" href="{{ .RelPermalink }}">
  <div class="article-card__body">
    <p class="article-card__summary-line">
        <span class="article-card__date">{{- partial "date.html" .Date -}}</span>
        <strong class="article-card__inline-title">{{ .Title }}</strong>
        {{ if ne .Params.tags nil }}
          <span class="tag-list">
            {{ range .Params.tags }}<span class="tag-list__tag">{{ . }}</span>{{ end }}
          </span>
        {{ end }}
    </p>
  </div>
</a>
