{{/*
  ## Examples

  In a page

      {{ partial "page-tags.html" . }}

  */}}

<span class="tag-list">
  {{ range $name := .Params.Tags }}
    {{ with $.Site.GetPage (printf "/tags/%s" $name) }}
      <a href="{{ .RelPermalink }}" class="tag-list__tag">{{ $name }}</a>
    {{ end }}
  {{ end }}
</span>
