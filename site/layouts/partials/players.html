{{/*
  Scope: players
  */}}

<div class="table-scroll">
  <table class="data-table data-table--full">
    <thead>
      <tr>
        <th>背番号</th>
        <th class="data-table__cell--medium">名前</th>
        <th class="data-table__cell--medium">学校</th>
        <th>投</th>
        <th>打</th>
      </tr>
    </thead>
    <tbody>
      {{ range . }}
        <tr>
          <td>{{ .number }}</td>
          <td>{{ .name }}</td>
          <td>{{ .school }}</td>
          <td>{{ .threw }}</td>
          <td>{{ .batted }}</td>
        </tr>
      {{ end }}
    </tbody>
  </table>
</div>
